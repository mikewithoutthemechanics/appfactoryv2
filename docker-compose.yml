version: "3.9"
services:
  web:
    build:
      context: ./apps/web
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_USER: postgres
      POSTGRES_DB: appfactory
    volumes:
      - postgres-data:/var/lib/postgresql/data
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - GENERATE_SOURCEMAP=true
      - EXECUTIONS_PROCESS=main
    volumes:
      - ./docker/n8n:/data
  posthog:
    image: posthog/posthog:latest
    ports:
      - "8000:8000"
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=example
      - DATABASE_NAME=appfactory
    depends_on:
      - postgres
  payfast-mock:
    image: node:18-alpine
    build:
      context: ./docker/payfast-mock
      dockerfile: Dockerfile
    ports:
      - "8001:3000"
    depends_on:
      - postgres
volumes:
  postgres-data:
